name: Prepare clean repository history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-history.yml"

permissions:
  contents: write

jobs:
  create-clean-root:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current site snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create a clean root commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan clean-history
          git add -A
          git commit -m "Rebuild repository from clean snapshot"
          git push --force origin HEAD:refs/heads/history-cleanup
