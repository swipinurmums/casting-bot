name: Discover opportunities

on:
  workflow_dispatch:
  push:
    paths:
      - "collector/**"
      - "data/sources.json"
      - "data/email-leads.json"
      - ".github/workflows/discover.yml"
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: discover-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect configured public feeds and safely publish results
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python collector/collect.py
            if git diff --quiet -- data/opportunities.json; then
              echo "No feed changes."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/opportunities.json
            git commit -m "Refresh discovered opportunities"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying against latest main (attempt $attempt)."
          done
          echo "Could not publish after three attempts."
          exit 1
